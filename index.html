<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>足立シティオーケストラ 過去の演奏会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-2: #f0eeea;
    --border: #e2dfd8;
    --text-primary: #1a1916;
    --text-secondary: #5c5a55;
    --text-muted: #9c9a94;
    --accent: #1f4e79;
    --accent-light: #e8f0f8;
    --accent-mid: #2d6fad;
    --tag-bg: #eef4fa;
    --tag-text: #1f4e79;
    --cancelled-bg: #fff4f4;
    --cancelled-border: #fcd5d5;
    --cancelled-text: #c0392b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.05);
    --radius: 12px;
    --radius-sm: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* ===== HEADER ===== */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: var(--text-primary);
  }
  .logo-sub {
    font-size: 11px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ===== HERO ===== */
  .hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 40px;
  }
  .hero-inner {
    max-width: 960px;
    margin: 0 auto;
  }
  .hero-eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-mid);
    margin-bottom: 12px;
  }
  .hero-title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .hero-notice {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fffbe6;
    border: 1px solid #f5e27a;
    color: #7d6a00;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 100px;
  }
  .hero-notice::before {
    content: "ℹ";
    font-size: 12px;
  }

  /* ===== CONTROLS ===== */
  .controls {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 24px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .count-badge {
    font-size: 13px;
    color: var(--text-muted);
    margin-right: auto;
  }
  .count-badge strong {
    color: var(--text-primary);
    font-weight: 500;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    letter-spacing: 0.02em;
  }
  .btn:hover {
    background: var(--surface-2);
    border-color: #c8c4bc;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .btn-primary:hover {
    background: #1a4269;
    border-color: #1a4269;
  }

  /* ===== TIMELINE LIST ===== */
  .concert-list {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ===== YEAR DIVIDER ===== */
  .year-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 4px;
  }
  .year-label {
    font-family: 'DM Serif Display', serif;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .year-line {
    height: 1px;
    background: var(--border);
    flex: 1;
  }

  /* ===== CONCERT CARD ===== */
  .concert-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .concert-card:hover {
    box-shadow: var(--shadow-md);
    border-color: #ccc9c0;
  }
  .concert-card.cancelled {
    background: var(--cancelled-bg);
    border-color: var(--cancelled-border);
  }

  .card-header {
    width: 100%;
    background: none;
    border: none;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    text-align: left;
    font-family: 'Noto Sans JP', sans-serif;
    color: inherit;
    transition: background 0.15s ease;
  }
  .card-header:hover { background: rgba(0,0,0,0.015); }

  .card-date-col {
    flex-shrink: 0;
    width: 64px;
    text-align: center;
  }
  .card-year {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.05em;
    line-height: 1;
    margin-bottom: 2px;
  }
  .card-month-day {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .cancelled .card-month-day { color: var(--cancelled-text); }

  .card-divider {
    width: 1px;
    height: 40px;
    background: var(--border);
    flex-shrink: 0;
  }

  .card-main {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }
  .cancelled .card-title { color: var(--text-secondary); }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .meta-item svg { opacity: 0.6; }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .tag-special {
    background: #e8f4ec;
    color: #1e6e3a;
  }
  .tag-cancelled {
    background: var(--cancelled-bg);
    color: var(--cancelled-text);
    border: 1px solid var(--cancelled-border);
  }
  .tag-chamber {
    background: #f3eff8;
    color: #5b35a0;
  }

  .card-chevron {
    flex-shrink: 0;
    color: var(--text-muted);
    transition: transform 0.25s ease;
  }
  .concert-card.open .card-chevron { transform: rotate(180deg); }

  /* ===== CARD BODY (accordion) ===== */
  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .concert-card.open .card-body { max-height: 2000px; }

  .card-body-inner {
    padding: 0 24px 24px 104px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    margin-bottom: 20px;
    font-size: 13.5px;
  }
  .detail-label {
    color: var(--text-muted);
    font-weight: 400;
    white-space: nowrap;
    padding-top: 1px;
  }
  .detail-value {
    color: var(--text-primary);
  }

  .program-section {
    margin-top: 4px;
  }
  .program-heading {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .program-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .program-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-primary);
    padding: 6px 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    line-height: 1.5;
  }
  .program-item::before {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    margin-top: 6px;
  }
  .program-item.encore {
    background: var(--accent-light);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .program-item.encore::before { background: var(--accent-mid); opacity: 0.5; }

  .encore-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-mid);
    margin: 12px 0 6px;
  }

  /* ===== POSTER IMAGES ===== */
  .poster-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .poster-heading {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .poster-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .poster-thumb {
    position: relative;
    flex: 0 0 auto;
    width: 100px;
    height: 142px; /* A4比率 */
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: var(--shadow-sm);
  }
  .poster-thumb:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: var(--shadow-md);
  }
  .poster-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* プレースホルダー（画像なし） */
  .poster-placeholder {
    width: 100px;
    height: 142px;
    border-radius: 6px;
    border: 1.5px dashed var(--border);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.03em;
    text-align: center;
    padding: 8px;
    flex: 0 0 auto;
  }
  .poster-placeholder svg { opacity: 0.4; }

  /* ===== LIGHTBOX ===== */
  .lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10, 10, 10, 0.88);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    padding: 16px;
    cursor: zoom-out;
  }
  .lightbox-overlay.active { display: flex; }
  .lightbox-overlay img {
    max-width: min(90vw, 600px);
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    cursor: default;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: white;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.22); }

  /* ===== EMPTY ===== */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ===== FOOTER ===== */
  .site-footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .card-body-inner { padding-left: 16px; padding-right: 16px; }
    .card-date-col { width: 52px; }
    .card-month-day { font-size: 18px; }
    .card-title { font-size: 14px; }
    .detail-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .detail-grid > * { font-size: 13px; }
    /* label + value を横並びにしてモバイルでも読みやすく */
    .detail-label {
      display: inline;
      color: var(--text-muted);
      font-size: 12px;
    }
    .detail-label::after { content: "　"; }
    .detail-value { display: inline; }
    /* 各行ごとに改行 */
    .detail-row { display: block; margin-bottom: 4px; }
    .program-item { font-size: 12.5px; padding: 5px 10px; }
    .controls { padding: 14px 16px 0; gap: 8px; }
    .btn { padding: 7px 12px; font-size: 12px; }
    .concert-list { padding: 12px 12px 48px; gap: 6px; }
    .hero { padding: 28px 16px 24px; }
    .header-inner { padding: 0 16px; height: 56px; }
    .logo-mark { width: 32px; height: 32px; font-size: 15px; }
    .logo-text { font-size: 13px; }
    /* ポスターも少し小さく */
    .poster-thumb, .poster-placeholder { width: 84px; height: 119px; }
    .card-header { padding: 14px 16px; gap: 12px; }
    .meta-item { font-size: 11px; }
    .venue-text {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
    }
  }
  @media (max-width: 380px) {
    .card-date-col { width: 44px; }
    .card-month-day { font-size: 16px; }
    .card-title { font-size: 13px; }
    .poster-thumb, .poster-placeholder { width: 72px; height: 102px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="#">
      <div class="logo-mark">ACO</div>
      <div>
        <div class="logo-text">足立シティオーケストラ</div>
        <div class="logo-sub">Adachi City Orchestra</div>
      </div>
    </a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">Concert Archive</div>
    <h1 class="hero-title">過去の演奏会一覧</h1>
    <span class="hero-notice">このページは現在整備中です。情報は順次追加予定です。</span>
  </div>
</section>

<!-- CONTROLS -->
<div class="controls">
  <p class="count-badge"><strong id="count">0</strong> 件の演奏会</p>
  <button class="btn" id="collapseAll">すべて閉じる</button>
  <button class="btn btn-primary" id="sortToggle">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4l4-3 4 3M2 8l4 3 4-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    昇順で表示
  </button>
</div>

<!-- CONCERT LIST -->
<main class="concert-list" id="concertList"></main>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="閉じる">×</button>
  <img id="lightboxImg" src="" alt="ポスター拡大表示">
</div>

<!-- FOOTER -->
<footer class="site-footer">
  © 足立シティオーケストラ
</footer>

// ===== HELPERS =====
function parseDate(str) { return new Date(str); }
function formatYear(str) { return str.slice(0,4); }
function formatMonthDay(str) {
  const d = new Date(str);
  const m = d.getMonth() + 1;
  const day = d.getDate();
  return `${m}/${day}`;
}

// ===== STATE =====
let ascending = false;

function getSorted() {
  const arr = [...concerts];
  return ascending ? arr : arr.reverse();
}

// ===== RENDER =====
function render() {
  const list = document.getElementById('concertList');
  const sorted = getSorted();
  list.innerHTML = '';
  document.getElementById('count').textContent = sorted.length;

  let lastYear = null;

  sorted.forEach(c => {
    const year = formatYear(c.date);

    if (year !== lastYear) {
      const div = document.createElement('div');
      div.className = 'year-divider';
      div.innerHTML = `<span class="year-label">${year}</span><span class="year-line"></span>`;
      list.appendChild(div);
      lastYear = year;
    }

    const card = document.createElement('div');
    card.className = 'concert-card' + (c.cancelled ? ' cancelled' : '');
    card.dataset.id = c.id;

    // tags
    let tagHtml = '';
    if (c.cancelled) tagHtml += `<span class="tag tag-cancelled">公演中止</span>`;
    if (c.tag === 'special') tagHtml += `<span class="tag tag-special">特別演奏会</span>`;
    if (c.tag === 'chamber') tagHtml += `<span class="tag tag-chamber">室内楽</span>`;
    if (c.tag === 'community') tagHtml += `<span class="tag tag-special">地域コンサート</span>`;

    // poster image badge on card header
    const hasImages = c.images && c.images.length > 0;
    const imageBadge = hasImages
      ? `<span class="meta-item"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 8l3-3 2.5 2.5L9 5l2 3" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>ポスターあり</span>`
      : '';

    // program items
    let programHtml = c.program.map(p =>
      `<li class="program-item">${escHtml(p)}</li>`
    ).join('');

    let encoreHtml = '';
    if (c.encore && c.encore.length) {
      encoreHtml = `<p class="encore-label">アンコール</p>
        <ul class="program-list">
          ${c.encore.map(e => `<li class="program-item encore">${escHtml(e)}</li>`).join('')}
        </ul>`;
    }

    // detail grid rows
    let detailRows = '';
    if (c.venue && !c.cancelled) detailRows += `<span class="detail-label">会場</span><span class="detail-value">${escHtml(c.venue)}</span>`;
    if (c.conductor) detailRows += `<span class="detail-label">指揮</span><span class="detail-value">${escHtml(c.conductor)}</span>`;
    if (c.soloist) detailRows += `<span class="detail-label">独奏</span><span class="detail-value">${escHtml(c.soloist)}</span>`;
    if (c.note) detailRows += `<span class="detail-label">備考</span><span class="detail-value">${escHtml(c.note)}</span>`;

    // poster section
    let posterHtml = '';
    if (hasImages) {
      const thumbs = c.images.map(src =>
        `<div class="poster-thumb" data-src="${escHtml(src)}" role="button" tabindex="0" aria-label="ポスターを拡大表示">
          <img src="${escHtml(src)}" alt="${escHtml(c.title)} ポスター" loading="lazy">
        </div>`
      ).join('');
      posterHtml = `
        <div class="poster-section">
          <p class="poster-heading">ポスター</p>
          <div class="poster-grid">${thumbs}</div>
        </div>`;
    } else {
      // プレースホルダー（画像なし）
      posterHtml = `
        <div class="poster-section">
          <p class="poster-heading">ポスター</p>
          <div class="poster-grid">
            <div class="poster-placeholder">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 13l5-5 4 4 3-3 4 4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
              <span>準備中</span>
            </div>
          </div>
        </div>`;
    }

    card.innerHTML = `
      <button class="card-header" aria-expanded="false">
        <div class="card-date-col">
          <div class="card-year">${year}</div>
          <div class="card-month-day">${formatMonthDay(c.date)}</div>
        </div>
        <div class="card-divider"></div>
        <div class="card-main">
          <div class="card-title">${escHtml(c.title)}</div>
          <div class="card-meta">
            ${c.venue && !c.cancelled ? `<span class="meta-item"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1a3.5 3.5 0 0 1 3.5 3.5C9.5 7.5 6 11 6 11S2.5 7.5 2.5 4.5A3.5 3.5 0 0 1 6 1z" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="4.5" r="1" fill="currentColor"/></svg><span class="venue-text">${escHtml(c.venue)}</span></span>` : ''}
            ${imageBadge}
            ${tagHtml}
          </div>
        </div>
        <svg class="card-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="card-body">
        <div class="card-body-inner">
          ${detailRows ? `<div class="detail-grid">${detailRows}</div>` : ''}
          <div class="program-section">
            <p class="program-heading">プログラム</p>
            <ul class="program-list">${programHtml}</ul>
            ${encoreHtml}
          </div>
          ${posterHtml}
        </div>
      </div>
    `;

    // accordion toggle
    card.querySelector('.card-header').addEventListener('click', () => {
      card.classList.toggle('open');
      const expanded = card.classList.contains('open');
      card.querySelector('.card-header').setAttribute('aria-expanded', expanded);
    });

    // poster lightbox
    card.querySelectorAll('.poster-thumb').forEach(thumb => {
      const openLightbox = () => openLightboxWith(thumb.dataset.src);
      thumb.addEventListener('click', openLightbox);
      thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(); } });
    });

    list.appendChild(card);
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== LIGHTBOX =====
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

function openLightboxWith(src) {
  lightboxImg.src = src;
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
  lightboxClose.focus();
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
  lightboxImg.src = '';
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox(); });

// ===== CONTROLS =====
document.getElementById('sortToggle').addEventListener('click', () => {
  ascending = !ascending;
  document.getElementById('sortToggle').innerHTML = ascending
    ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4-3 4 3M2 8l4 3 4-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 降順で表示`
    : `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4-3 4 3M2 8l4 3 4-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 昇順で表示`;
  render();
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.concert-card.open').forEach(c => {
    c.classList.remove('open');
    c.querySelector('.card-header').setAttribute('aria-expanded', 'false');
  });
});

render();
</script>
</body>
